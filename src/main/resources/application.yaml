spring:
  application:
    name: moneylog
  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: update     # 로컬 개발 편의(운영은 validate/none 권장)
    properties:
      hibernate:
        format_sql: true
    open-in-view: false    # 지연로딩 관련 문제 예방(권장)

springdoc:
  swagger-ui:
    path: /swagger-ui.html

cors:
  # 콤마로 구분된 허용 오리진 목록. 배포 시 CORS_ALLOWED_ORIGINS 환경변수로 실제 프론트 도메인을 넣는다.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

jwt:
  # 운영은 반드시 환경변수(JWT_SECRET)로 주입. 기본값은 로컬/테스트(CI)에서만 사용되는 더미 키.
  secret: ${JWT_SECRET:local-test-only-dummy-secret-key-32bytes-minimum!!}
  expiration-ms: 3600000           # accessToken 1시간
  refresh-expiration-ms: 1209600000   # refreshToken 14일

---
# ===== 로컬 프로파일 (H2 인메모리) =====
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:mem:moneylog;MODE=MySQL   # MySQL 문법 호환 모드
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true        # http://localhost:8080/h2-console
      path: /h2-console

  jpa:
    show-sql: true
