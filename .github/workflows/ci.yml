name: CI

# main으로의 push, 그리고 PR 열릴 때 실행
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # 1) 소스 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2) JDK 17 설치 + Gradle 캐시
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 3) gradlew 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 4) 빌드 + 테스트 (테스트 실패 시 여기서 워크플로가 멈춘다)
      - name: Build & Test
        run: ./gradlew clean build

      # 5) (선택) 테스트 리포트 보관
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test