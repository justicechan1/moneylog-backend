spring:
  application:
    name: moneylog
  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: update     # 로컬 개발 편의(운영은 validate/none 권장)
    properties:
      hibernate:
        format_sql: true
    open-in-view: false    # 지연로딩 관련 문제 예방(권장)

springdoc:
  swagger-ui:
    path: /swagger-ui.html

cors:
  # 콤마로 구분된 허용 오리진 목록. 배포 시 CORS_ALLOWED_ORIGINS 환경변수로 실제 프론트 도메인을 넣는다.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

jwt:
  # 절대 소스코드에 하드코딩 금지! 환경변수(JWT_SECRET)로 주입받는다.
  secret: ${JWT_SECRET}
  expiration-ms: 3600000           # accessToken 1시간
  refresh-expiration-ms: 1209600000   # refreshToken 14일

---
# ===== 로컬 프로파일 (H2 인메모리) =====
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:mem:moneylog;MODE=MySQL   # MySQL 문법 호환 모드
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true        # http://localhost:8080/h2-console
      path: /h2-console

  jpa:
    show-sql: true

---
# ===== 운영 프로파일 (MySQL 8) =====
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/moneylogdb
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate   # 운영은 스키마 자동 변경 금지
    show-sql: false
