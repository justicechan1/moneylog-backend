services:
  mysql:
    image: mysql:8.0
    container_name: moneylog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: moneylogdb
      MYSQL_USER: admin
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3309:3306"
    volumes:
      - moneylog-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - moneylog-net

  app:
    image: ${APP_IMAGE:-ghcr.io/justicechan1/moneylog-backend:latest}
    build: .   # 로컬 테스트 시 현재 Dockerfile로 빌드 (CI/배포는 GHCR 이미지 pull)
    container_name: moneylog-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_USERNAME: admin
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    networks:
      - moneylog-net

volumes:
  moneylog-mysql-data:

networks:
  moneylog-net: