# ===== 운영 프로파일 (MySQL 8) =====
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/moneylogdb
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update   # 캡스톤 편의상 update, 실무는 Flyway 등 마이그레이션 권장
    show-sql: false